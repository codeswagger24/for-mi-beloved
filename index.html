<style>

    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .start[hidden], .bar[hidden], button[hidden] { display: none; }

    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    padding: 24px;

  }

    margin: 0;
    font-family: var(--display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(40px, 9vw, 64px);
    line-height: 1;
    letter-spacing: .01em;
    text-wrap: balance;
  }
  .start p { margin: 0; color: var(--muted); max-width: 30ch; line-height: 1.55; text-wrap: balance; }
  button {
    font: inherit;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
    letter-spacing: .06em;
    text-transform: uppercase;
    font-size: 12px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1405; padding: 12px 30px; font-size: 13px; }
  button.primary:hover:not(:disabled) { background: #f7c95a; color: #1a1405; }

</style>

[215,32,42],0.12,0.9,6.8],[212,662,72,[235,155,45],0.3,0.8,7.2],[492,675,70,[205,55,150],0.0,0.8,7.5],[182,860,58,[215,175,40],0.4,0.8,8.4],[510,892,60,[215,35,45],0.2,0.8,8.6],[270,745,108,[222,70,190],0.1,0.95,8.0],[430,790,118,[228,212,185],0.35,0.9,8.2],[335,855,92,[225,140,60],0.2,0.9,8.7],[425,905,56,[60,100,225],0.15,0.8,8.5]],"buds":[[320,492,[120,28,45]],[362,503,[135,35,50]],[412,485,[165,40,55]]]};
const DW = 688, DH = 640, DURATION = 35, BLOOM_AT = 14, PULSE = 0.045, PULSE_SPEED = 1.6;
const Y0 = 440, BASE = 1045, VOLUME = 0.5;
const STEM = [150, 220, 90], LEAF_DARK = [40, 120, 40], LEAF_LIGHT = [130, 215, 80],
      LEAF_RIB = [200, 245, 140], GOLD = [240, 185, 55];
const CODE = "ymin = 1e9, ymax = -1e9, maxw = 0; for (k = 0; k < n; k++) { x = pts[k][0]; y = pts[k][1]; if (x > xmax) xmax = x; if (y < ymin) ymin = y; if (y > ymax) ymax = y; } ";
const FIRST = Math.min(...D.flowers.map(f => f[6]));

const S = 1.25, W = Math.round(DW * S), H = Math.round(DH * S);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const LY = mk(W, H), Lx = LY.getContext('2d');      // bouquet shapes, transparent background
const MX = mk(W, H), Mx = MX.getContext('2d');      // shapes multiplied by the code texture

const clamp = (x, lo = 0, hi = 1) => x < lo ? lo : x > hi ? hi : x;
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const prog = (T, a, b) => ease((T - a) / (b - a));
const shade = (c, k) => [clamp(c[0] * k, 0, 255) | 0, clamp(c[1] * k, 0, 255) | 0, clamp(c[2] * k, 0, 255) | 0];
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const bez = (a, b, c, t) => { const u = 1 - t; return [u*u*a[0] + 2*u*t*b[0] + t*t*c[0], u*u*a[1] + 2*u*t*b[1] + t*t*c[1]]; };
const dbez = (a, b, c, t) => [2*(1-t)*(b[0]-a[0]) + 2*t*(c[0]-b[0]), 2*(1-t)*(b[1]-a[1]) + 2*t*(c[1]-b[1])];

function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// ---- background: plain black
const sky = mk(W, H);
(function () { const x = sky.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, W, H); })();

// ---- texture: rows of tiny code text, multiplied over the bouquet
const tex = mk(W, H);
(function () {
  const x = tex.getContext('2d'), r = rng(3), k = S;
  x.fillStyle = 'rgb(66,66,66)'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#fff'; x.textBaseline = 'top';
  x.font = `${(8 * k).toFixed(1)}px Consolas, Menlo, "DejaVu Sans Mono", monospace`;
  const step = 7 * k, rep = CODE.repeat(Math.ceil(W / 24) + 6);
  for (let row = 0; row < H / step + 2; row++) {
    const off = Math.floor(r() * CODE.length);
    x.fillText(rep.slice(off, off + Math.floor(W / 4) + 6), -Math.floor(r() * 5), row * step - 2 * k);
  }
})();

// ---- firefly glow sprites
const glows = [0, 1, 2].map(size => {
  const r = Math.floor((9 + 5 * size) * S) + 1, n = 2 * r + 1, c = mk(n, n), x = c.getContext('2d'),
        im = x.createImageData(n, n);
  for (let yy = 0; yy < n; yy++) for (let xx = 0; xx < n; xx++) {
    const dd = Math.hypot(xx - r, yy - r) / r, f = Math.pow(Math.max(0, 1 - dd), 1.7), core = Math.max(0, 1 - dd * 2.4), i = (yy * n + xx) * 4;
    im.data[i] = clamp(f * 255 + core * 120, 0, 255); im.data[i+1] = clamp(f * 235 + core * 120, 0, 255);
    im.data[i+2] = clamp(f * 110 + core * 150, 0, 255); im.data[i+3] = 255;
  }
  x.putImageData(im, 0, 0);
  return { r, c };
});

// ---- drawing helpers (on the shapes layer)
function poly(pts, fill) {
  Lx.beginPath(); Lx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) Lx.lineTo(pts[i][0], pts[i][1]);
  Lx.closePath(); Lx.fillStyle = fill; Lx.fill();
}
function stroke(pts, color, w) {
  Lx.beginPath(); Lx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) Lx.lineTo(pts[i][0], pts[i][1]);
  Lx.strokeStyle = color; Lx.lineWidth = w; Lx.lineJoin = 'round'; Lx.lineCap = 'round'; Lx.stroke();
}

function leaf(P, p0, p1, p2, wmax, g, dark, light, rib) {
  if (g < 0.03) return;
  const m = Math.max(3, Math.floor(16 * g)), left = [], right = [], cen = [];
  for (let s = 0; s <= m; s++) {
    const t = g * s / m, [x, y] = bez(p0, p1, p2, t), [dx, dy] = dbez(p0, p1, p2, t), n = Math.hypot(dx, dy) || 1,
          nx = -dy / n, ny = dx / n, w = wmax * Math.pow(Math.sin(Math.PI * Math.min(1, t)), 0.75) * (0.35 + 0.65 * Math.min(1, g * 1.5));
    left.push([x + nx * w, y + ny * w]); right.push([x - nx * w, y - ny * w]); cen.push([x, y]);
  }
  poly(left.concat(right.slice().reverse()).map(p => P(...p)), rgb(dark));
  poly(cen.concat(left.slice().reverse()).map(p => P(...p)), rgb(light));
  if (cen.length > 1) stroke(cen.map(p => P(...p)), rgb(rib), 1);
}

function bud(P0, cx, cy, a, b, col) {
  if (a < 1 || b < 1) return;
  const egg = (aa, bb, ox, oy) => {
    const pts = [];
    for (let k = 0; k < 24; k++) { const th = 2 * Math.PI * k / 24;
      pts.push(P0(cx + ox + aa * Math.cos(th) * (1 + 0.25 * Math.sin(th)), cy + oy + bb * Math.sin(th))); }
    return pts;
  };
  poly(egg(a, b, 0, 0), rgb(shade(col, 0.72)));
  poly(egg(a * 0.72, b * 0.78, -a * 0.08, -b * 0.08), rgb(shade(col, 1.0)));
  poly(egg(a * 0.30, b * 0.40, -a * 0.25, -b * 0.28), rgb(shade(col, 1.3)));
}

function petal(P0, cx, cy, L, wm, bend, rot, tilt, u0, u1, wscale) {
  const n = 10, top = [], bot = [];
  for (let s = 0; s <= n; s++) {
    const u = u0 + (u1 - u0) * s / n, w = wm * wscale * Math.sin(Math.PI * Math.pow(u, 0.8)), yb = bend * L * u * u;
    top.push([u * L, yb - w]); bot.push([u * L, yb + w]);
  }
  const c = Math.cos(rot), sn = Math.sin(rot);
  return top.concat(bot.reverse()).map(([x, y]) => P0(cx + x * c - y * sn, cy + (x * sn + y * c) * tilt));
}

function lily(P0, cx, cy, R, col, rot, tilt, openW) {
  for (const outer of [true, false]) {
    for (let k = 0; k < 6; k++) {
      if (((k % 2 === 1) !== outer)) continue;
      const ang = rot + k * Math.PI / 3, L = R * (outer ? 0.88 : 1.0), wm = 0.25 * L * openW, bend = (k % 4 < 2) ? 0.07 : -0.07;
      poly(petal(P0, cx, cy, L, wm, bend, ang, tilt, 0, 1, 1), rgb(shade(col, outer ? 0.72 : 0.86)));
      poly(petal(P0, cx, cy, L, wm, bend, ang, tilt, 0.10, 0.97, 0.55), rgb(shade(col, outer ? 0.85 : 1.08)));
      const mid = [];
      for (let s = 0; s < 7; s++) {
        const u = 0.12 + 0.80 * s / 6, x = u * L, y = bend * L * u * u;
        mid.push(P0(cx + x * Math.cos(ang) - y * Math.sin(ang), cy + (x * Math.sin(ang) + y * Math.cos(ang)) * tilt));
      }
      stroke(mid, rgb(shade(col, 1.35)), 1);
    }
  }
  const c = P0(cx, cy), sx = 0.12 * R * S;
  Lx.beginPath(); Lx.ellipse(c[0], c[1], sx, Math.max(0.1, sx * tilt), 0, 0, 7); Lx.fillStyle = rgb(GOLD); Lx.fill();
}

// ---- one frame. T = seconds of music/animation, tm = same clock (sway, breathing)
function render(T, tm) {
  Lx.clearRect(0, 0, W, H);
  if (T < BLOOM_AT) T = T * FIRST / BLOOM_AT;
  else T = FIRST + (T - BLOOM_AT) * (12.0 - FIRST) / (DURATION - BLOOM_AT);
  const amp = prog(T, 10.0, 12.0);
  const sw = (x, y) => Math.sin(tm * 1.15 + y * 0.006 + x * 0.002) * amp * Math.pow(clamp((BASE - y) / 600), 2) * 8;
  const P = (x, y) => [(x + sw(x, y)) * S, (y - Y0) * S];
  const P0 = (x, y) => [x * S, (y - Y0) * S];

  const tips = [];
  for (const st of D.stems) {
    const [p0, p1, p2] = st.p, g = prog(T, 0.3 + st.delay, 4.2 + st.delay), m = Math.max(1, Math.floor(40 * g)), pts = [];
    for (let s = 0; s <= m; s++) pts.push(P(...bez(p0, p1, p2, g * s / m)));
    if (g > 0.002) stroke(pts, rgb(STEM), Math.max(2, Math.floor(2.2 * S)));
    tips.push([bez(p0, p1, p2, g), g]);
    for (const [t, side, Ln, w] of st.leaves) {
      const lg = prog(g, t, t + 0.2);
      if (lg < 0.03) continue;
      const a = bez(p0, p1, p2, t), [tx, ty] = dbez(p0, p1, p2, t), ang = Math.atan2(ty, tx) + side * 48 * Math.PI / 180,
            dx = Math.cos(ang), dy = Math.sin(ang);
      leaf(P, a, [a[0] + dx * Ln * 0.5, a[1] + dy * Ln * 0.5 - Ln * 0.08], [a[0] + dx * Ln, a[1] + dy * Ln], w, lg, LEAF_DARK, LEAF_LIGHT, LEAF_RIB);
    }
  }
  for (const [p0, p1, p2, w, st, mul] of D.leaves) {
    leaf(P, p0, p1, p2, w, prog(T, st, st + 2.6), shade(LEAF_DARK, mul), shade(LEAF_LIGHT, mul), shade(LEAF_RIB, mul));
  }
  const nf = D.flowers.length;
  D.buds.forEach((b, k) => {
    const [[x, y], g] = tips[nf + k], s = prog(g, 0.9, 1.0);
    if (s > 0.02) bud(P0, x + sw(x, y), y - 8, 7 * s, 15 * s, b[2]);
  });
  D.flowers.forEach(([fx, fy, R, col, rot, tilt, bs], k) => {
    const [[x, y], g] = tips[k], s = prog(g, 0.88, 1.0);
    if (s < 0.02) return;
    const cx = x + sw(x, y), cy = y, b = prog(T, bs, bs + 2.3);
    if (b < 0.3) bud(P0, cx, cy, 0.30 * R * s, 0.40 * R * s, col);
    if (b > 0.06) {
      const e = ease(b), pz = Math.sin(tm * PULSE_SPEED + k * 0.9) * PULSE * e;
      lily(P0, cx, cy, R * (0.30 + 0.70 * e) * (1 + pz), shade(col, 0.62 + 0.38 * e + 1.2 * pz),
           rot + tm * 0.04 * amp + (1 - e) * 0.6, tilt, (0.5 + 0.5 * e) * (1 + 0.8 * pz));
    }
  });

  // multiply the shapes by the code texture, keep only where shapes are
  Mx.globalCompositeOperation = 'source-over'; Mx.clearRect(0, 0, W, H);
  Mx.drawImage(LY, 0, 0);
  Mx.globalCompositeOperation = 'multiply'; Mx.drawImage(tex, 0, 0);
  Mx.globalCompositeOperation = 'destination-in'; Mx.drawImage(LY, 0, 0);

  // sky, stars, bouquet, fireflies
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(sky, 0, 0);
  ctx.drawImage(MX, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  for (const f of D.flies) {
    const ap = prog(T, FIRST + f.late * 0.4, FIRST + 2.5 + f.late * 0.4);
    if (ap <= 0.01) continue;
    const blink = Math.pow(Math.max(0, Math.sin(tm * f.bf * 2.2 + f.bp)), 2), a = clamp(blink * ap, 0, 0.999);
    if (a < 0.06) continue;
    const x = f.hx + f.ax * Math.sin(tm * f.w1 + f.p1) + 0.5 * f.ax * Math.sin(tm * f.w2 * 1.7 + f.p2),
          y = f.hy + f.ay * Math.sin(tm * f.w2 + f.p2) - 14 * Math.sin(tm * 0.2 + f.p1), g = glows[f.size];
    ctx.globalAlpha = a;
    ctx.drawImage(g.c, Math.floor(x * S) - g.r, Math.floor((y - Y0) * S) - g.r);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

// ---- audio (Web Audio, so volume and looping behave the same on phones)
const $ = id => document.getElementById(id);
let actx = null, buf = null, src = null, gain = null, muted = false, started = false, t0 = 0;
try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
const ready = (async () => {
  if (!actx) return false;
  try {
    const res = await fetch('music.mp3'); const ab = await res.arrayBuffer();
    buf = await new Promise((ok, no) => actx.decodeAudioData(ab, ok, no));
    return true;
  } catch (e) { return false; }
})();

const clock = () => (actx && src) ? actx.currentTime : performance.now() / 1000;
function stopSrc() { try { if (src) src.stop(); } catch (e) {} src = null; }

async function begin() {
  try { if (actx && actx.state !== 'running') await actx.resume(); } catch (e) {}
  stopSrc();
  if (actx && buf) {
    src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
    gain = gain || Object.assign(actx.createGain(), {}); gain.gain.value = muted ? 0 : VOLUME;
    gain.connect(actx.destination); src.connect(gain); src.start();
  }
  t0 = clock(); started = true;
  $('start').hidden = true; $('bar').hidden = false;
  $('mute').hidden = !src;
}

$('go').addEventListener('click', begin);
$('replay').addEventListener('click', begin);
$('mute').addEventListener('click', () => {
  muted = !muted; if (gain) gain.gain.value = muted ? 0 : VOLUME;
  $('mute').textContent = muted ? 'Sound off' : 'Sound on';
});

ready.then(ok => {
  $('go').disabled = false; $('go').textContent = 'Begin';
  if (!ok) $('hint').textContent = 'The music could not load here, so it will play without sound. It takes about 35 seconds.';
});

function frame() {
  const t = started ? clock() - t0 : 0;
  render(t, t);
  if (started) requestAnimationFrame(frame);
}
render(0, 0);
$('go').addEventListener('click', () => requestAnimationFrame(frame));
$('replay').addEventListener('click', () => { /* loop already running */ });
window.__lily = { render };
</script>
